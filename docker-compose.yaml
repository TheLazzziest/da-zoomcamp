services:
  clickhouse:
    image: clickhouse/clickhouse-server:25.3.7.194-alpine
    volumes:
      - ch-data:/var/lib/clickhouse
      - .ch/config.xml:/etc/clickhouse-server/config.d/docker.xml
    environment:
      CLICKHOUSE_USER: root
      CLICKHOUSE_PASSWORD: da-zoomcamp
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
      CLICKHOUSE_INIT_TIMEOUT: 60 # 1min
      CLICKHOUSE_DB: sandbox
      GCS_ENDPOINT: https://storage.googleapis.com/
      GCS_BUCKET: ${GCS_BUCKET:-da-zoomcamp}
      GCS_ACCESS_KEY_ID: ${GCS_ACCESS_KEY_ID:-}
      GCS_SECRET_ACCESS_KEY: ${GCS_SECRET_ACCESS_KEY:-}
    cap_add:
      - SYS_NICE
      - NET_ADMIN
      - IPC_LOCK
      - SYS_PTRACE
    ports:
      - "8123:8123" # HTTP port
      - "9000:9000" # TCP port
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G
    healthcheck:
      test: ["CMD", "clickhouse-client", "--user", "root", "--password", "da-zoomcamp", "-q", "SELECT 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  trino:
    image: trinodb/trino:478
    hostname: trino
    container_name: trino
    profiles: ["trino"]
    depends_on:
      clickhouse:
        condition: service_healthy
    volumes:
      - ./etc/catalog:/etc/trino/catalog
      - ${GCP_KEY_FILE}:/etc/trino/gcp-creds.json:ro
    ports:
      - "8080:8080"
    environment:
      GCP_PROJECT_ID: ${GCP_PROJECT_ID:-my-project}
      CH_HOST: ${CH_HOST:-clickhouse}
      CH_HTTP_PORT: ${CH_HTTP_PORT:-8123}
      CH_USER: ${CH_USER:-root}
      CH_PASSWORD: ${CH_PASSWORD:-da-zoomcamp}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/v1/cluster"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  ch-data:
