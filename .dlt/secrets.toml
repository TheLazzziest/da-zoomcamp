# Sandbox credentials — fill in real values.
# Warehouse = local ClickHouse in Docker (dlt destination, system of record).
# Staging   = Google Cloud Storage, parquet interop layer.
# BigQuery  = cloud analytics/reporting; not a dlt destination (query-only).
# Never commit real values. `.dlt/secrets.toml` is untracked.

# --- Local ClickHouse (docker-compose, ports 8123/9000) ---
[destination.clickhouse.credentials]
database = "sandbox"
username = "root"
password = "da-zoomcamp"
host = "localhost"
port = 9000
http_port = 8123
secure = 0

# --- Google Cloud Storage (staging, read-only when running local) ---
[destination.filesystem.credentials]
project_id = "<GCP_PROJECT_ID>"
private_key = "<PRIVATE_KEY>"
client_email = "<SA>@<project>.iam.gserviceaccount.com"
token_uri = "https://oauth2.googleapis.com/token"

# --- BigQuery (cloud analytics; not a dlt destination) ---
